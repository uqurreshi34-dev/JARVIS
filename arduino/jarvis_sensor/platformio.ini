; One sketch, built two ways. The Arduino IDE opens jarvis_sensor.ino, and
; PlatformIO builds that same file (src_dir is this folder), so there is no
; second copy to drift out of step.
;
;   pio run -e wroom -t upload      WROOM-32 DevKit
;   pio run -e c3 -t upload         C3 Super Mini
;   pio device monitor

[platformio]
src_dir = .
default_envs = wroom

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library
build_flags =
    -I .
build_src_filter = +<jarvis_sensor.ino>

[env:wroom]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
; The Super Mini talks over its own USB: without these, the monitor stays blank.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
