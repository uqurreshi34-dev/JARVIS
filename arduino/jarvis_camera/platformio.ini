; The JARVIS camera, built two ways like the sensor: the Arduino IDE opens
; jarvis_camera.ino (board "AI Thinker ESP32-CAM"), and PlatformIO builds the
; same file -- for either board:
;
;   pio run -e cam -t upload        the ESP32-CAM (AI Thinker): "my room cam"
;   pio run -e s3cam -t upload      the ESP32-S3-CAM (N16R8): "house cam"
;   pio run -e s3detect -t upload   the same, and it recognises what it sees
;                                   (python tools/femto_build.py first)
;   pio run -e s3profile -t upload  s3detect, saying where each look's time goes
;   pio run -e aicam -t upload      DFRobot's ESP32-S3 AI Camera: "toy cam"
;   pio run -e aicamdetect -t upload  the same, recognising what it sees
;   pio device monitor -e s3cam
;
; The S3 board has two USB-C sockets: flash and watch it through the one
; marked TTL (its CH340, the driver already installed). OTG is the chip's own
; USB, not used here. Each board takes its name from its env below, so one
; jarvis_secrets.h (wifi, token) serves both.

[platformio]
src_dir = .
default_envs = cam

[env:cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -I .
; PlatformIO turns the sketch into jarvis_camera.ino.cpp beside it and compiles
; that, deleting it afterwards; the filter names it, and nothing else in the
; folder (its .pio copies of the libraries above all) is built twice.
build_src_filter = +<jarvis_camera.ino.cpp>

; The ESP32-S3-CAM (Goouuu, ESP32-S3-N16R8): 16 MB flash, 8 MB octal PSRAM.
; The S3's camera pins are chosen in the sketch by the chip it is built for.
[env:s3cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -I .
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D JARVIS_CAMERA_NAME_HOUSE
build_src_filter = +<jarvis_camera.ino.cpp>

; The ESP32-S3-CAM as above, and recognising what it sees on the board itself:
; YOLO26n (80 kinds of thing, from people to cups), compiled to C by FEMTO-ML.
; Its sources are made into detect/ by `python tools/femto_build.py` (from the
; repo's root, with FEMTO-ML cloned beside JARVIS) and kept out of git. Flash
; s3cam again to go back: nothing else changes.
; The face finder beside it, in faces/ (also made by tools/femto_build.py): built only if there.
; FEMTO_NO_FLOAT_INPUT: the board writes both models' int8 input itself, so their float input
; buffers (0.8 and 1 MB of PSRAM) are not taken.
[env:s3detect]
extends = env:s3cam
build_flags =
    ${env:s3cam.build_flags}
    -I detect
    -I faces
    -D JARVIS_DETECT
    -D FEMTO_NO_FLOAT_INPUT
    -O2
build_src_filter = +<jarvis_camera.ino.cpp> +<detect/*.c> +<faces/*.c>

; s3detect, timing every step of the model: after each look the monitor shows
; the milliseconds by kind of step (convolutions, quantizing, ...) and the
; slowest dozen steps by name -- what to send when the looks are slow. A little
; slower than s3detect itself; flash s3detect again afterwards.
[env:s3profile]
extends = env:s3detect
build_flags =
    ${env:s3detect.build_flags}
    -D FEMTO_PROFILE=1

; DFRobot's ESP32-S3 AI Camera (DFR1154, V1.1): 16 MB flash, 8 MB octal PSRAM, as the S3-CAM, but
; its camera on other pins (JARVIS_BOARD_DFR1154 in the sketch) and its one USB-C socket the chip's
; own USB, so the monitor reads it there (USB_CDC_ON_BOOT). Its own name: "toy cam".
[env:aicam]
extends = env:s3cam
; Its "Hey Jarvis" ear, built in from wake/ when `python tools/toy_wake_model.py` has made it (the
; microWakeWord model and TensorFlow's micro audio frontend; kept out of git).
build_flags =
    -I .
    -I wake
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D JARVIS_BOARD_DFR1154
    -D JARVIS_CAMERA_NAME_TOY
build_src_filter = +<jarvis_camera.ino.cpp> +<wake/tensorflow/lite/experimental/microfrontend/lib/*.c> +<wake/tensorflow/lite/experimental/microfrontend/lib/*.cc>

; The AI Camera recognising what it sees, as s3detect (python tools/femto_build.py first).
[env:aicamdetect]
extends = env:aicam
build_flags =
    ${env:aicam.build_flags}
    -I detect
    -I faces
    -D JARVIS_DETECT
    -D FEMTO_NO_FLOAT_INPUT
    -O2
build_src_filter = +<jarvis_camera.ino.cpp> +<wake/tensorflow/lite/experimental/microfrontend/lib/*.c> +<wake/tensorflow/lite/experimental/microfrontend/lib/*.cc> +<detect/*.c> +<faces/*.c>
