; The JARVIS camera, built two ways like the sensor: the Arduino IDE opens
; jarvis_camera.ino (board "AI Thinker ESP32-CAM"), and PlatformIO builds the
; same file.
;
;   pio run -e cam -t upload
;   pio device monitor

[platformio]
src_dir = .
default_envs = cam

[env:cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    -I .
build_src_filter = +<jarvis_camera.ino>
