<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Breakout and retest: which chart, when</text>

  <!-- Left panel: 4-hour chart -->
  <rect x="20" y="55" width="470" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="255" y="85" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">4-HOUR CHART: spot the breakout</text>
  <line x1="40" y1="250" x2="470" y2="250" stroke="#2563eb" stroke-width="3"/>
  <text x="44" y="242" font-size="13" fill="#2563eb" font-weight="600">ceiling 4229</text>
  <line x1="40" y1="420" x2="470" y2="420" stroke="#db2777" stroke-width="3"/>
  <text x="44" y="412" font-size="13" fill="#db2777" font-weight="600">floor 4114</text>
  <!-- range candles -->
  <g stroke="#475569" stroke-width="2">
    <line x1="80" y1="300" x2="80" y2="380"/><rect x="72" y="320" width="16" height="45" fill="#ef4444"/>
    <line x1="115" y1="310" x2="115" y2="400"/><rect x="107" y="330" width="16" height="50" fill="#22c55e"/>
    <line x1="150" y1="270" x2="150" y2="360"/><rect x="142" y="285" width="16" height="50" fill="#22c55e"/>
    <line x1="185" y1="280" x2="185" y2="370"/><rect x="177" y="295" width="16" height="45" fill="#ef4444"/>
    <line x1="220" y1="290" x2="220" y2="360"/><rect x="212" y="300" width="16" height="40" fill="#22c55e"/>
    <!-- breakout candle closes above ceiling -->
    <line x1="265" y1="180" x2="265" y2="300"/><rect x="255" y="195" width="20" height="90" fill="#22c55e"/>
  </g>
  <circle cx="265" cy="195" r="22" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="300" y="150" font-size="14" fill="#15803d" font-weight="700">STEP 1</text>
  <text x="300" y="168" font-size="13" fill="#334155">A 4-hour candle CLOSES</text>
  <text x="300" y="184" font-size="13" fill="#334155">above the ceiling.</text>
  <text x="300" y="200" font-size="13" fill="#b91c1c" font-weight="700">Do NOT buy yet.</text>
  <text x="300" y="300" font-size="13" fill="#334155">Set your alert at 4229</text>
  <text x="300" y="316" font-size="13" fill="#334155">and walk away. Price may</text>
  <text x="300" y="332" font-size="13" fill="#334155">come back hours later,</text>
  <text x="300" y="348" font-size="13" fill="#334155">or never (24 hours max).</text>

  <!-- Right panel: 15-minute chart -->
  <rect x="510" y="55" width="470" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="745" y="85" text-anchor="middle" font-size="17" font-weight="700" fill="#047857">15-MINUTE CHART: the retest entry</text>
  <line x1="530" y1="300" x2="960" y2="300" stroke="#2563eb" stroke-width="3"/>
  <text x="534" y="292" font-size="13" fill="#2563eb" font-weight="600">old ceiling 4229 = new floor</text>
  <g stroke="#475569" stroke-width="2">
    <line x1="560" y1="140" x2="560" y2="200"/><rect x="552" y="150" width="16" height="35" fill="#ef4444"/>
    <line x1="595" y1="170" x2="595" y2="235"/><rect x="587" y="180" width="16" height="40" fill="#ef4444"/>
    <line x1="630" y1="205" x2="630" y2="270"/><rect x="622" y="215" width="16" height="40" fill="#ef4444"/>
    <line x1="665" y1="240" x2="665" y2="295"/><rect x="657" y="248" width="16" height="35" fill="#ef4444"/>
    <!-- touch candle: wick to line, closes green -->
    <line x1="710" y1="225" x2="710" y2="306"/><rect x="700" y="240" width="20" height="45" fill="#22c55e"/>
  </g>
  <circle cx="710" cy="303" r="16" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="560" y="120" font-size="14" fill="#15803d" font-weight="700">STEP 2: price drifts back down to the line</text>
  <text x="735" y="235" font-size="14" fill="#15803d" font-weight="700">STEP 3</text>
  <text x="735" y="253" font-size="13" fill="#334155">A 15-min candle touches</text>
  <text x="735" y="269" font-size="13" fill="#334155">the line and CLOSES green</text>
  <text x="735" y="285" font-size="13" fill="#334155">above it: BUY at its close.</text>
  <!-- stop and target -->
  <line x1="700" y1="345" x2="960" y2="345" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="735" y="365" font-size="13" fill="#dc2626" font-weight="700">STOP: $10 below your entry</text>
  <line x1="700" y1="140" x2="960" y2="140" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="790" y="132" font-size="13" fill="#16a34a" font-weight="700">TARGET: $30 above (1:3)</text>
  <text x="560" y="420" font-size="13" fill="#334155">Call it off if a 15-min candle closes $10</text>
  <text x="560" y="436" font-size="13" fill="#334155">below the line, or a 4-hour candle closes</text>
  <text x="560" y="452" font-size="13" fill="#334155">back inside the old range.</text>

  <!-- footer -->
  <rect x="20" y="500" width="960" height="105" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="530" font-size="15" font-weight="700" fill="#9a3412">In one line:</text>
  <text x="40" y="555" font-size="14" fill="#1f2937">4-hour chart decides IF there was a breakout. 15-minute chart decides WHEN you enter, on the retest.</text>
  <text x="40" y="580" font-size="14" fill="#1f2937">Breakdown below the floor is the mirror image: 4-hour close below 4114, wait for price to rise back to it,</text>
  <text x="40" y="598" font-size="14" fill="#1f2937">then SELL when a 15-minute candle touches the line and closes red below it. Stop $10 above, target $30 below.</text>
</svg>
